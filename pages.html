<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your pages · Clay Studio</title>
<style>
:root{--ink:#e9f0e9;--muted:#9fb3a8;--panel:#1b252c;--line:#b5e4c933;--mint:#b5e4c9;--deep:#153d2c;--warn:#f0a58b;--sun:#e5cf68}
*{box-sizing:border-box}html{background:#10161b}body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.5 'Segoe UI',system-ui,sans-serif;background:radial-gradient(circle at 12% -10%,#1f3a2f 0,transparent 460px),radial-gradient(circle at 100% 0,#2a2340 0,transparent 420px)}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#ffffff12}button:hover{background:#ffffff22}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.primary{background:var(--mint);color:var(--deep);font-weight:700}.primary:hover{background:#cdeeda}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:34px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.3px}.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.5px}
h1{font-size:clamp(30px,4vw,44px);letter-spacing:-1px;line-height:1.1;margin:0 0 6px}.lede{color:var(--muted);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.cover{display:block;height:112px;padding:18px;text-decoration:none;color:#14201a;font-weight:800;font-size:20px;letter-spacing:-.4px;line-height:1.15;overflow-wrap:anywhere}
.cover:hover{filter:brightness(1.05)}
.meta{padding:12px 16px 4px;color:var(--muted);font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 14px}.acts button{padding:7px 11px;font-size:13px}.acts .del{color:var(--warn)}
.empty{border:1px dashed var(--line);border-radius:18px;padding:48px 24px;text-align:center;color:var(--muted)}.empty p{margin:0 0 18px;font-size:17px}
dialog{border:1px solid var(--line);border-radius:18px;background:#18222a;color:var(--ink);padding:22px;width:min(480px,calc(100vw - 32px))}
dialog::backdrop{background:#0008}dialog h2{margin:0 0 14px;font-size:21px}
label.field{display:block;margin-bottom:14px;color:var(--muted);font-size:13px}label.field input{display:block;width:100%;margin-top:6px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0f161b}
.starts{display:grid;gap:8px;margin-bottom:18px}.start{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.start:has(input:checked){border-color:var(--mint);background:#b5e4c912}.start b{display:block}.start span{color:var(--muted);font-size:13px}.start input{margin-top:4px;accent-color:var(--mint)}
/* the main button comes first, so Enter picks it; it still sits on the right */
.row{display:flex;flex-direction:row-reverse;justify-content:flex-start;gap:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:14px;background:#24323c;border:1px solid var(--line);box-shadow:0 12px 40px #0007;max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}
@media(max-width:560px){header{flex-wrap:wrap}.wrap{padding-top:18px}}
</style>
</head><body>
<div class="wrap">
  <header><div class="brand">Clay Studio<small>SHAPE IT BY HAND</small></div><button class="primary" data-new>New page</button></header>
  <h1>Your pages</h1>
  <p class="lede">Kept on this server, so any computer on your network sees the same work.</p>
  <div class="grid" id="pages" aria-live="polite"></div>
</div>
<dialog id="create" aria-labelledby="create-title"><form method="dialog">
  <h2 id="create-title">A new page</h2>
  <label class="field">Name<input name="title" required maxlength="80" placeholder="Our home server" autocomplete="off"></label>
  <div class="starts" role="radiogroup" aria-label="Start from">
    <label class="start"><input type="radio" name="from" value="blank" checked><div><b>Simple start</b><span>A heading, a few words, a button, two cards and a picture, ready to arrange.</span></div></label>
    <label class="start"><input type="radio" name="from" value="sample"><div><b>The Clay sample</b><span>The demo page Clay opens with, to play with.</span></div></label>
  </div>
  <div class="row"><button class="primary" value="ok">Create page</button><button value="cancel" formnovalidate>Cancel</button></div>
</form></dialog>
<dialog id="rename" aria-labelledby="rename-title"><form method="dialog">
  <h2 id="rename-title">Rename</h2>
  <label class="field">Name<input name="title" required maxlength="80" autocomplete="off"></label>
  <div class="row"><button class="primary" value="ok">Rename</button><button value="cancel" formnovalidate>Cancel</button></div>
</form></dialog>
<div class="toast" role="status" hidden><span></span></div>
<script>
(function(){
  'use strict';
  var list=document.getElementById('pages'),toast=document.querySelector('.toast'),toastTimer=0;
  var COVERS=['#ffd66b','#adddc5','#c5c6f4','#f6b8a2','#b7e0f2','#e9c7f0','#d8e7a4'];
  function cover(name){var h=0;for(var i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;return COVERS[h%COVERS.length];}
  var rel=window.Intl&&Intl.RelativeTimeFormat?new Intl.RelativeTimeFormat(undefined,{numeric:'auto'}):null;
  function ago(iso){if(!iso)return '';var s=(new Date(iso)-Date.now())/1000,u=[['year',31536000],['month',2592000],['day',86400],['hour',3600],['minute',60]];
    for(var i=0;i<u.length;i++)if(Math.abs(s)>=u[i][1])return rel?rel.format(Math.round(s/u[i][1]),u[i][0]):new Date(iso).toLocaleString();return 'just now';}
  function api(method,path,body){return fetch(path,{method:method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined}).then(function(r){
    if(!r.ok)return r.text().then(function(t){var m=/<p>Message: ([^<]*)/.exec(t);throw new Error(m?m[1]:'The server said '+r.status+'.');});return r.json();});}
  function say(text,action){clearTimeout(toastTimer);var span=toast.querySelector('span');span.textContent=text;toast.querySelectorAll('button').forEach(function(b){b.remove();});
    if(action){var b=document.createElement('button');b.textContent=action.label;b.addEventListener('click',function(){toast.hidden=true;action.run();});toast.appendChild(b);}
    toast.hidden=false;toastTimer=setTimeout(function(){toast.hidden=true;},action?10000:4000);}
  function fail(e){say(e.message||'Something went wrong.');}
  function render(pages){
    list.replaceChildren();
    if(!pages.length){var e=document.createElement('div');e.className='empty';e.style.gridColumn='1/-1';var p=document.createElement('p');p.textContent='No pages yet. Start one, then shape it by hand.';
      var b=document.createElement('button');b.className='primary';b.textContent='New page';b.addEventListener('click',create);e.append(p,b);list.appendChild(e);return;}
    pages.forEach(function(pg){
      var c=document.createElement('article');c.className='card';c.dataset.name=pg.name;
      var a=document.createElement('a');a.className='cover';a.href=pg.url;a.textContent=pg.title;a.style.background=cover(pg.name);a.setAttribute('aria-label','Open '+pg.title);
      var m=document.createElement('div');m.className='meta';m.textContent='Edited '+ago(pg.updated);
      var acts=document.createElement('div');acts.className='acts';
      [['Rename',function(){rename(pg);}],['Duplicate',function(){duplicate(pg);}],['Delete',function(){remove(pg);},'del']].forEach(function(x){
        var b=document.createElement('button');b.textContent=x[0];if(x[2])b.className=x[2];b.addEventListener('click',x[1]);acts.appendChild(b);});
      c.append(a,m,acts);list.appendChild(c);});
  }
  function load(){return api('GET','/api/pages').then(render,fail);}
  function ask(dialog,title){return new Promise(function(done){var f=dialog.querySelector('form'),input=f.querySelector('input[name=title]');f.reset();input.value=title||'';
    dialog.onclose=function(){done(dialog.returnValue==='ok'?input.value.trim():null);};dialog.returnValue='';dialog.showModal();input.focus();input.select();});}
  function create(){var d=document.getElementById('create');ask(d,'').then(function(title){if(!title)return;var from=d.querySelector('input[name=from]:checked').value;
    api('POST','/api/pages',{title:title,from:from}).then(function(r){location.href=r.url;},fail);});}
  function rename(pg){ask(document.getElementById('rename'),pg.title).then(function(title){if(!title||title===pg.title)return;
    api('PATCH','/api/pages/'+pg.name,{title:title}).then(function(r){say('Renamed to “'+r.title+'”.');load();},fail);});}
  function duplicate(pg){api('POST','/api/pages',{from:'copy:'+pg.name}).then(function(r){say('Made “'+r.title+'”.');load();},fail);}
  function remove(pg){api('DELETE','/api/pages/'+pg.name).then(function(r){load();
    say('Moved “'+pg.title+'” to the trash.',{label:'Undo',run:function(){api('POST','/api/trash/'+r.trash+'/restore').then(function(){say('“'+pg.title+'” is back.');load();},fail);}});},fail);}
  document.querySelector('[data-new]').addEventListener('click',create);
  load();
})();
</script>
</body></html>
